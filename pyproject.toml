[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ai"
version = "0.3.0"
description = "A Windows-first, local-first persistent AI orchestration platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pyautogui>=0.9.54"]
voice = ["vosk>=0.3.45", "pyttsx3>=2.90", "PyAudio>=0.2.14"]
media = ["numpy>=1.26", "onnxruntime>=1.18"]
all = ["pyautogui>=0.9.54", "vosk>=0.3.45", "pyttsx3>=2.90", "PyAudio>=0.2.14", "numpy>=1.26", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
