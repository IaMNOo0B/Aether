[app]
name = "AETHER"
environment = "local"
log_level = "INFO"

[models]
provider = "ollama"
enabled = false
base_url = "http://127.0.0.1:11434"
model = "phi3:mini-4k-q4_0"
timeout_seconds = 120

[storage]
database = "data/aether.sqlite3"

[limits]
max_history_messages = 8
max_prompt_characters = 12000
