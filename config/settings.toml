[app]
name = "AETHER"
environment = "local"
log_level = "INFO"

[models]
provider = "ollama"
enabled = false
base_url = "http://127.0.0.1:11434"
model = "phi3:mini-4k-q4_0"
timeout_seconds = 120
# For openai_compatible only: read the API key from this environment variable.
# Leave empty for local OpenAI-compatible servers that do not require a key.
api_key_env = "AETHER_API_KEY"

# Optional ordered fallback endpoints. AETHER tries the primary provider first,
# then each fallback only when the previous provider raises a provider error.
# API keys are read from the named environment variable, never stored here.
# [[models.fallbacks]]
# provider = "openai_compatible"
# base_url = "https://api.example.com/v1"
# model = "your-model"
# timeout_seconds = 120
# api_key_env = "AETHER_CLOUD_KEY"

[storage]
database = "data/aether.sqlite3"

[limits]
max_history_messages = 8
max_prompt_characters = 12000
max_autonomy_steps = 5
max_research_results = 8
tool_timeout_seconds = 60

[research]
enabled = true
timeout_seconds = 15
max_pages = 5

[autonomy]
enabled = false
allow_read_only = true
allow_workspace_writes = false
allow_code_execution = false
workspace = "workspace"

[desktop]
enabled = false
allow_input = false
allowed_apps = ["notepad.exe", "calc.exe"]

[voice]
enabled = false
wake_word = "jarvis"
vosk_model_path = "models/vosk"
speak_responses = true

[scheduler]
# Off by default. When enabled, scheduled goals run through read-only tools only.
enabled = false
poll_interval_seconds = 30
max_tasks_per_tick = 1

[memory]
# Semantic retrieval is optional. No embedding model is downloaded automatically.
semantic_enabled = false
embedding_provider = "ollama"
embedding_base_url = "http://127.0.0.1:11434"
embedding_model = "nomic-embed-text"
embedding_timeout_seconds = 30
semantic_weight = 0.45
index_batch_size = 32

[resources]
enabled = true
max_cpu_percent = 95.0
max_ram_percent = 92.0
min_free_ram_mb = 512
max_gpu_utilization_percent = 98.0
min_free_vram_mb = 512
require_gpu_telemetry = false
cpu_sample_seconds = 0.1
