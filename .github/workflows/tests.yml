name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Run OMEGA acceptance checks
        shell: pwsh
        run: |
          python -m aether.acceptance --json reports/acceptance/latest.json
          $acceptanceExit = $LASTEXITCODE
          if ($acceptanceExit -eq 1) { exit 1 }
          if ($acceptanceExit -eq 2) {
            $report = Get-Content reports/acceptance/latest.json -Raw | ConvertFrom-Json
            $counts = $report.counts | ConvertTo-Json -Compress
            Write-Host "::warning::OMEGA acceptance is PARTIAL. Counts: $counts. Green core tests do not mean the full OMEGA specification passed."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## OMEGA acceptance: PARTIAL"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Counts: $counts"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "The Python test suite passed, but one or more acceptance requirements remain incomplete. See the uploaded JSON artifact."
            exit 0
          }
          if ($acceptanceExit -ne 0) { exit $acceptanceExit }
      - name: Upload OMEGA acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-omega-acceptance-report
          path: reports/acceptance/latest.json
          if-no-files-found: ignore
